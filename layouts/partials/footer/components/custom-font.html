<script>
    (function () {
        const customFont = document.createElement('link');
        // Google's official mainland-China mirror. The returned CSS points to
        // fonts.gstatic.cn automatically, so the whole chain stays on .cn hosts.
        customFont.href = "https://fonts.googleapis.cn/css2?family=Lato:wght@300;400;700&display=swap";
        customFont.type = "text/css";
        customFont.rel = "stylesheet";
        document.head.appendChild(customFont);
    }());
</script>
